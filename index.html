:root{--bg:#101113;--p:#1a1c20;--b:#2a2d33;--t:#f2f3f5;--m:#8a8f98;--a:#f79200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Arial,sans-serif}
h1{font-size:18px;margin:0 0 14px}.app{display:grid;grid-template-columns:190px minmax(280px,380px) 1fr;gap:16px;padding:16px;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.col{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px}
.tpl{display:block;width:100%;background:var(--bg);border:2px solid var(--b);border-radius:10px;padding:14px 10px;margin-bottom:10px;color:var(--t);cursor:pointer;text-align:left;font:inherit;font-weight:600}
.tpl.on{border-color:var(--a);color:var(--a)}
input,textarea{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px;font:inherit}
input[type=range]{padding:0}textarea{height:110px;resize:vertical;margin:4px 0 8px}
.r{display:flex;gap:6px;margin-bottom:8px;align-items:center}.r>*{min-width:0}.r small{flex:none;width:80px}
button.b{background:var(--a);color:#111;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}button.g{background:var(--b);color:var(--t)}
.pv{position:sticky;top:16px;align-self:start}.pv canvas{width:100%;border-radius:10px;display:block}small{color:var(--m)}
</style></head><body>
